[project]
name = "entirius-django-enrichment"
version = "2.3.0"
description = "Content enrichment module for Entirius: proposals for descriptions, attributes, SEO and media with review and undo"
keywords = ["django", "enrichment", "product-content", "review-workflow", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "celery>=5.0",
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "entirius-django-utils>=2.1.0",
    "nh3>=0.2",
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "factory-boy", "respx>=0.21"]
# Pillow only for the seed_demo_proposals command (lazy import — placeholder PNGs)
demo = ["Pillow"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-enrichment/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-enrichment"
Changelog = "https://github.com/entirius/entirius-django-enrichment/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-enrichment/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_enrichment"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
"src/django_enrichment/testing/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["django_enrichment"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-migrations"

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
